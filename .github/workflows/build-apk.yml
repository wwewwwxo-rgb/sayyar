
name: Build SAYYAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "lib/**"
      - "main.dart"
      - "pubspec.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project
        run: |
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then
            mkdir -p lib
            mv main.dart lib/main.dart
          fi
          flutter create --platforms=android --project-name sayyar .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
